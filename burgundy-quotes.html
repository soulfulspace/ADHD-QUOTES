<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="300 original quotes about confidence, creativity, soft strength, and more.">
  <meta name="author" content="SoulfulSpace">
  <title>Burgundy Quotes · SoulfulSpace</title>
  <style>
    :root {
      color-scheme: light;
      --card: #f5ede9;
      --panel: #ffffff;
      --ink: #7d0303;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: transparent;
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .widget {
      display: grid;
      gap: 10px;
      width: min(100%, 470px);
      margin-inline: auto;
      padding: clamp(12px, 5vw, 20px);
      border-radius: 12px;
      background: var(--card);
      text-align: center;
    }

    .topics {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-self: end;
      max-width: 100%;
      font-size: 12px;
      font-weight: 650;
    }

    select,
    button {
      min-height: 38px;
      border: 0;
      border-radius: 7px;
      color: #ffffff;
      background: var(--ink);
      font: 650 12px/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    select {
      max-width: 100%;
      min-width: 0;
      padding: 5px 8px;
    }

    blockquote {
      display: grid;
      place-items: center;
      min-height: 130px;
      margin: 0;
      padding: 12px clamp(12px, 6vw, 25px);
      border-radius: 8px;
      background: var(--panel);
    }

    .quote {
      margin: 0;
      font: 400 clamp(19px, 5.8vw, 28px)/1.4 Georgia, "Times New Roman", serif;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(0, 1.5fr);
      gap: 6px;
    }

    button {
      min-height: 44px;
      padding: 6px 4px;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: default; }
    button:hover:not(:disabled) { text-decoration: underline; text-underline-offset: 3px; }

    :is(button, select):focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    footer { font-size: 10px; font-weight: 600; line-height: 1.3; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

    <label class="topics">Topic
      <select id="topic">
        <option value="">All topics</option>
      </select>
    </label>

    <blockquote>
      <p class="quote" id="quote" role="status" aria-atomic="true">Let your ambition be as particular as your taste.</p>

      <button type="button" id="next">New quote</button>
    </div>
    <span class="sr-only" id="copy-status" role="status"></span>
    <footer>@soulfulspace</footer>
    <noscript>Turn on JavaScript to browse the quotes.</noscript>
  </main>

    const allQuotes = Object.values(quotesByTopic).flat();
    const storageKey = 'soulfulspace-burgundy-quotes';
    const topic = document.querySelector('#topic');
    const quote = document.querySelector('#quote');
    const back = document.querySelector('#back');
    const copy = document.querySelector('#copy');
    const next = document.querySelector('#next');
    const copyStatus = document.querySelector('#copy-status');
    let currentQuote;
    let deck = [];
    let quoteHistory = [];
    let copyTimer;

    function readPreferences() {
      try {
        return JSON.parse(sessionStorage.getItem(storageKey)) || {};
      } catch {
        return {};
      }
    }

    function renderQuote() {
      quote.textContent = currentQuote;
      back.disabled = quoteHistory.length === 0;
      try {
        sessionStorage.setItem(storageKey, JSON.stringify({ topic: topic.value, lastQuote: currentQuote }));
      } catch {
        // The widget can still shuffle when embedded storage is blocked.
      }
    }

    function shuffledQuotes(previousQuote) {
      const shuffled = [...(quotesByTopic[topic.value] || allQuotes)];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      const last = shuffled.length - 1;
      if (shuffled[last] === previousQuote) {
        [shuffled[0], shuffled[last]] = [shuffled[last], shuffled[0]];
      }
      return shuffled;
    }

    function newQuote() {
      if (!deck.length) deck = shuffledQuotes(currentQuote);
      if (currentQuote) quoteHistory.push(currentQuote);
      currentQuote = deck.pop();
      renderQuote();
    }

    function resetTopic(previousQuote) {
      deck = shuffledQuotes(previousQuote);
      quoteHistory = [];
      currentQuote = undefined;
      newQuote();
    }

    function previousQuote() {
      if (!quoteHistory.length) return;
      currentQuote = quoteHistory.pop();
      renderQuote();
      if (back.disabled && document.activeElement === back) next.focus();
    }

    function legacyCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.readOnly = true;
      textarea.className = 'sr-only';
      textarea.style.position = 'fixed';
      const focused = document.activeElement;
      document.body.append(textarea);
      textarea.select();
      try {
        return document.execCommand('copy');
      } catch {
        return false;
      } finally {
        textarea.remove();
        focused?.focus({ preventScroll: true });
      }
    }

    async function copyQuote() {
      const text = currentQuote;
      let copied = false;
      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {
        // Some embed hosts restrict the Clipboard API.
      }
      if (!copied) copied = legacyCopy(text);

      clearTimeout(copyTimer);
      if (copied) {
        copy.textContent = 'Copied';
        copyStatus.textContent = 'Quote copied to clipboard.';
      } else {
        const range = document.createRange();
        range.selectNodeContents(quote);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        copy.textContent = 'Selected';
        copyStatus.textContent = 'Quote selected. Use your device’s copy command.';
      }
      copyTimer = setTimeout(() => {
        copy.textContent = 'Copy';
        copyStatus.textContent = '';
      }, 1800);
    }

    for (const name of Object.keys(quotesByTopic)) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      topic.append(option);
    }

    const saved = readPreferences();
    if (Object.hasOwn(quotesByTopic, saved.topic)) topic.value = saved.topic;
    topic.addEventListener('change', () => resetTopic(currentQuote));
    back.addEventListener('click', previousQuote);
    next.addEventListener('click', newQuote);
    copy.addEventListener('click', copyQuote);
    resetTopic(saved.lastQuote);
