const hints = {"Starting": "Start with the next small, doable thing.", "Focus": "Your attention deserves support, not judgment.", "Overwhelm": "You can make the moment smaller.", "Time": "A gentle plan is still a plan.", "Rest": "Your energy matters, too.", "Routines": "Build systems that bend with real life.", "Self-kindness": "Speak to yourself like someone worth caring for.", "Emotions": "Feelings can be real without being permanent.", "Progress": "Notice the effort behind the outcome.", "Motivation": "Momentum can begin very quietly.", "Boundaries": "Your needs are allowed to take up space.", "Creativity": "Different ways of thinking can be valuable."};
const quoteEl = document.getElementById('quote');
const hintEl = document.getElementById('hint');
const categoryTag = document.getElementById('categoryTag');
const counter = document.getElementById('counter');
const topicSelect = document.getElementById('category');
const backButton = document.getElementById('previous');
const copyButton = document.getElementById('copy');
const nextButton = document.getElementById('next');
Object.keys(hints).forEach(topic => {
  const opt = document.createElement('option'); opt.value = topic; opt.textContent = topic;
  topicSelect.appendChild(opt);
});
let deck = [];
let history = [];
let historyPos = -1;
let eligible = [];
function shuffle(items) {
  const result = items.slice();
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function resetTopic() {
  eligible = quotes.map((item,index) => ({...item,index})).filter(item => topicSelect.value === 'All' || item.category === topicSelect.value);
  deck = shuffle(eligible.map(item => item.index));
  history = [];
  historyPos = -1;
  showNext();
}
function render() {
  const item = quotes[history[historyPos]];
  quoteEl.textContent = item.quote;
  hintEl.textContent = hints[item.category];
  categoryTag.textContent = item.category + ' ✦';
  const shown = historyPos + 1;
  counter.textContent = shown + ' viewed · ' + eligible.length + ' in ' + (topicSelect.value === 'All' ? 'all topics' : topicSelect.value);
  backButton.disabled = historyPos <= 0;
}
function showNext() {
  if (historyPos < history.length - 1) {
    historyPos++;
  } else {
    if (deck.length === 0) {
      // Begin a fresh shuffle after all quotes in the selected topic were shown.
      deck = shuffle(eligible.map(item => item.index));
      // Avoid an immediate repeat across cycles if possible.
      if (deck.length > 1 && deck[deck.length - 1] === history[historyPos]) {
        [deck[deck.length - 1], deck[0]] = [deck[0], deck[deck.length - 1]];
      }
    }
    history.push(deck.pop());
    historyPos++;
  }
  render();
}
function showPrevious() { if(historyPos > 0) { historyPos--; render(); } }
async function copyQuote() {
  const text = quotes[history[historyPos]].quote;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const textarea = document.createElement('textarea');
      textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
      document.body.appendChild(textarea); textarea.select();
      if (!document.execCommand('copy')) throw Error('Copy unsupported');
      textarea.remove();
    }
    copyButton.textContent = 'Copied ✓';
  } catch (e) { copyButton.textContent = 'Select quote to copy'; }
  setTimeout(() => { copyButton.textContent = 'Copy'; }, 1800);
}
topicSelect.addEventListener('change',resetTopic);
backButton.addEventListener('click',showPrevious);
nextButton.addEventListener('click',showNext);
copyButton.addEventListener('click',copyQuote);
resetTopic();
</script>
