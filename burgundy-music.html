  <script type="module">
const loopSeconds = 7.2;
const eyeAtlas = {"x":269,"y":99,"width":146,"height":89};

function smooth(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}

function influence(x, y, [cx, cy, rx, ry, angle = 0, core = 0.43]) {
  const dx = x - cx;
  const dy = y - cy;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const radius = Math.hypot((cos * dx + sin * dy) / rx, (-sin * dx + cos * dy) / ry);
  return 1 - smooth((radius - core) / (1 - core));
}

function blinkAt(time, start, hold) {
  const elapsed = time - start;
  return smooth(elapsed / 0.16) * (1 - smooth((elapsed - 0.16 - hold) / 0.25));
}

function eyeCoordinates(x, y, eye) {
  const dx = x - eye.x;
  const dy = y - eye.y;
  return [eye.cos * dx + eye.sin * dy, -eye.sin * dx + eye.cos * dy];
}

function blinkOffset(y, amount, radius) {
  // Draw the upper lid down and squeeze the iris into the closing lash line.
  const edge = y < amount * 1.2 ? -radius : radius;
  const lid = amount * 1.2;
  const slit = 1 - amount * 0.94;
  const distance = y - lid;
  const narrow = radius * 0.37 * slit;
  if (Math.abs(distance) < narrow) return distance / slit - y;
  const rest = (distance - Math.sign(distance) * narrow)
    / (edge - lid - Math.sign(distance) * narrow);
  return Math.sign(distance) * radius * 0.37 + rest * edge * 0.63 - y;
}

function resample(source, target, i, x, y, width) {
  const left = Math.floor(x);
  const top = Math.floor(y);
  const fx = x - left;
  const fy = y - top;
  const p = (top * width + left) * 4;
  const next = width * 4;
  const w0 = (1 - fx) * (1 - fy) * source[p + 3];
  const w1 = fx * (1 - fy) * source[p + 7];
  const w2 = (1 - fx) * fy * source[p + next + 3];
  const w3 = fx * fy * source[p + next + 7];
  const alpha = w0 + w1 + w2 + w3;

  target[i + 3] = alpha;
  if (!target[i + 3]) {
    target[i] = target[i + 1] = target[i + 2] = 0;
    return;
  }
  for (let c = 0; c < 3; c++) {
    target[i + c] = (w0 * source[p + c] + w1 * source[p + 4 + c]
      + w2 * source[p + next + c] + w3 * source[p + next + 4 + c]) / alpha;
  }
}

function createPortraitLoop(source, width, rig, atlas) {
  const { region, head, eyes } = rig;
  const [left, top, patchWidth, patchHeight] = region;
  const eyelids = eyes.map(([x, y, rx, ry, angle]) => (
    { x, y, rx, ry, sin: Math.sin(angle), cos: Math.cos(angle) }
  ));
  const eyeFrames = [0, 1].map(frame => {
    const pose = new Uint8ClampedArray(source);
    for (let y = 0; y < eyeAtlas.height; y++) {
      for (let x = 0; x < eyeAtlas.width; x++) {
        const px = x + eyeAtlas.x;
        const py = y + eyeAtlas.y;
        const mix = Math.max(...eyelids.map(eye => {
          const [u, v] = eyeCoordinates(px, py, eye);
          const across = smooth((1 - Math.abs(u) / eye.rx) / 0.22);
          const vertical = smooth((1 - Math.abs(v - 1) / (eye.ry + 3)) / 0.38);
          return across * vertical;
        }));
        if (!mix) continue;
        const target = (py * width + px) * 4;
        const sample = ((frame * eyeAtlas.height + y) * eyeAtlas.width + x) * 4;
        for (let c = 0; c < 3; c++) {
          pose[target + c] += (atlas[sample + c] - pose[target + c]) * mix;
        }
      }
    }
    return pose;
  });
  const [closedEyes, rightGaze] = eyeFrames;
  const closedPixel = new Uint8ClampedArray(4);
  const pixels = [];

  for (let y = top; y < top + patchHeight; y++) {
    for (let x = left; x < left + patchWidth; x++) {
      const headWeight = influence(x, y, head);
      const eye = eyelids.find(lid => {
        const [u, v] = eyeCoordinates(x, y, lid);
        return Math.abs(u) < lid.rx + 8 && Math.abs(v) < lid.ry + 8;
      });
      if (headWeight || eye) {
        pixels.push({ x, y, headWeight, eye });
      }
    }
  }

  return (output, elapsed) => {
    const time = (elapsed + 0.55) % loopSeconds;
    const phase = time / loopSeconds * Math.PI * 2;
    const turn = -Math.cos(phase - 0.15);
    const headSlide = 2.2 * turn;
    const headAngle = 0.023 * turn;
    const headSin = Math.sin(headAngle);
    const headCosOffset = Math.cos(headAngle) - 1;
    const headBob = 0.8 * Math.sin(phase);
    const blink = Math.max(blinkAt(time, 1.18, 0.28), blinkAt(time, 3.55, 0.045),
      blinkAt(time, 5.1, 0.34));
    // The gaze changes behind the fully closed eyelids.
    const openEyes = time >= 1.48 && time < 5.38 ? rightGaze : source;
    const closedMix = smooth((blink - 0.40) / 0.27);

    for (const { x, y, headWeight, eye } of pixels) {
      const dx = x - head[0] - headSlide;
      const dy = y - head[1] - 58;
      const sx = x + (headCosOffset * dx + headSin * dy - headSlide) * headWeight;
      const sy = y + (-headSin * dx + headCosOffset * dy - headBob) * headWeight;
      const index = ((y - top) * patchWidth + x - left) * 4;

      if (eye) {
        if (closedMix >= 1) {
          resample(closedEyes, output, index, sx, sy, width);
          continue;
        }
        const [u, v] = eyeCoordinates(sx, sy, eye);
        const lateral = smooth((1 - Math.abs(u) / eye.rx) / 0.41);
        const close = blink * lateral * 0.82;
        const lid = blinkOffset(v, close, eye.ry) * (1 - smooth((Math.abs(v) / eye.ry - 0.80) / 0.20));
        resample(openEyes, output, index, sx - lid * eye.sin, sy + lid * eye.cos, width);
        if (closedMix > 0) {
          resample(closedEyes, closedPixel, 0, sx, sy, width);
          for (let c = 0; c < 3; c++) {
            output[index + c] += (closedPixel[c] - output[index + c]) * closedMix;
          }
        }
      } else {
        resample(source, output, index, sx, sy, width);
      }
    }
  };
}

  let frame = 0;
  let elapsed = 0;
  let lastTime = 0;

  function draw(now) {
    if (!lastTime || now - lastTime >= 32) {
      elapsed += lastTime ? Math.min(0.05, (now - lastTime) / 1000) : 0;
      lastTime = now;
      animate(patch.data, elapsed);
      context.putImageData(patch, x, y);
    }
    frame = requestAnimationFrame(draw);
  }

  function syncMotion() {
    cancelAnimationFrame(frame);
    lastTime = 0;
    if (motion.matches || document.hidden) {
      figure.classList.remove('playing');
      return;
    }
    figure.classList.add('playing');
    frame = requestAnimationFrame(draw);
  }

  motion.addEventListener('change', syncMotion);
  document.addEventListener('visibilitychange', syncMotion);
