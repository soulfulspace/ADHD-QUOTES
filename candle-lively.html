<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Three textured burgundy pillar candles with larger, lively flickering flames on a transparent background.">
  <meta name="author" content="SoulfulSpace">
  <title>Burgundy Candles · Lively Flame · SoulfulSpace</title>
  <style>
    html, body {
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
    }

    figure {
      width: min(94vw, 260px, calc((100vh - 24px) * .71));
      margin: 0;
      text-align: center;
    }

    .candles {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
    }

    figcaption {
      margin-top: 5px;
      color: #7d0303;
      font: 600 10px/1.3 system-ui, sans-serif;
    }

    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flicker var(--duration) ease-in-out var(--phase) infinite;
    }

    .flame-left { --duration: 2.83s; --phase: -.82s; }
    .flame-back { --duration: 3.41s; --phase: -2.35s; }
    .flame-right { --duration: 2.59s; --phase: -1.46s; }

    @keyframes flicker {
      0%, 100% { transform: rotate(-2deg) scale(1.14, 1.29); opacity: .97; }
      9% { transform: rotate(3deg) scale(1.18, 1.38); opacity: 1; }
      19% { transform: rotate(8deg) scale(1.04, 1.21); opacity: .93; }
      26% { transform: rotate(4deg) scale(1.17, 1.45); opacity: 1; }
      37% { transform: rotate(-3deg) scale(1.11, 1.32); opacity: .98; }
      45% { transform: rotate(-8deg) scale(1.23, 1.13); opacity: .93; }
      53% { transform: rotate(-4deg) scale(1.16, 1.27); opacity: .97; }
      65% { transform: rotate(2deg) scale(1.09, 1.48); opacity: 1; }
      74% { transform: rotate(6deg) scale(1.15, 1.25); opacity: .95; }
      86% { transform: rotate(-2deg) scale(1.13, 1.38); opacity: 1; }
      93% { transform: rotate(-5deg) scale(1.20, 1.24); opacity: .96; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flame { animation: none; transform: scale(1.14, 1.3); }
    }

    @media (prefers-color-scheme: dark) {
      figcaption { color: #e7c0ba; }
    }
  </style>
</head>
<body>
  <figure>
    <svg class="candles" xmlns="http://www.w3.org/2000/svg" width="930" height="1310" viewBox="164 -105 930 1310" role="img" aria-labelledby="candle-title">
      <title id="candle-title">Three burgundy pillar candles with flickering flames</title>
      <defs>
        <linearGradient id="flame-edge" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe2a4" stop-opacity=".92"/>
          <stop offset=".24" stop-color="#fff0c8"/>
          <stop offset=".66" stop-color="#ffce78"/>
          <stop offset=".88" stop-color="#eb8a42"/>
          <stop offset="1" stop-color="#8f4c35" stop-opacity=".45"/>
        </linearGradient>
        <linearGradient id="flame-heart" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffdf1" stop-opacity="0"/>
          <stop offset=".33" stop-color="#fffdf1"/>
          <stop offset=".76" stop-color="#fff6cf"/>
          <stop offset="1" stop-color="#ffa04f" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="wax-light">
          <stop offset="0" stop-color="#ffc56e" stop-opacity=".30"/>
          <stop offset="1" stop-color="#ffc56e" stop-opacity="0"/>
        </radialGradient>
        <filter id="halo" x="-50%" y="-18%" width="200%" height="136%">
          <feGaussianBlur stdDeviation="4"/>
        </filter>
        <filter id="soft-edge" x="-22%" y="-10%" width="144%" height="120%">
          <feGaussianBlur stdDeviation="1.35"/>
        </filter>
        <path id="flame-shape" d="M0 2 C-8 2 -14 -7 -14 -22 C-15 -41 -9 -65 -4 -81 C-2 -91 -2 -99 1 -105 C6 -91 7 -76 10 -63 C16 -46 17 -29 13 -16 C11 -4 5 2 0 2Z"/>
        <g id="flame-light">
          <use href="#flame-shape" fill="#ffb956" opacity=".42" filter="url(#halo)"/>
          <use href="#flame-shape" fill="url(#flame-edge)" filter="url(#soft-edge)"/>
          <path d="M0 -7 C-7 -9 -8 -24 -7 -39 C-7 -56 -1 -82 1 -92 C5 -74 10 -51 10 -35 C11 -19 7 -8 0 -7Z" fill="url(#flame-heart)" filter="url(#soft-edge)"/>
        </g>
      </defs>

      <image href="candle-assets/burgundy-candles.webp" width="1263" height="1245" preserveAspectRatio="none"/>

      <g aria-hidden="true" fill="url(#wax-light)">
        <ellipse cx="344" cy="451" rx="42" ry="13"/>
        <ellipse cx="685" cy="122" rx="45" ry="13"/>
        <ellipse cx="886" cy="759" rx="42" ry="13"/>
      </g>

      <g aria-hidden="true">
        <g transform="translate(344 404) scale(.89 .92)">
          <g class="flame flame-left"><use href="#flame-light"/></g>
        </g>
        <g transform="translate(685 79)">
          <g class="flame flame-back"><use href="#flame-light"/></g>
        </g>
        <g transform="translate(886 714) scale(.92 .96)">
          <g class="flame flame-right"><use href="#flame-light"/></g>
        </g>
      </g>
    </svg>
    <figcaption>@soulfulspace</figcaption>
  </figure>
</body>
</html>
