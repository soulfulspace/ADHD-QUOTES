  <script type="module">
const loopSeconds = 7.2;
const regions = {
  arm: [390, 190, 170, 265],
  kernel: [393, 197, 31, 30],
  eyes: [270, 108, 154, 77],
  lips: [335, 189, 65, 43]
};
const slots = {
  clean: [0, 0],
  arm: [170, 0],
  kernel: [0, 270],
  closed: [32, 270],
  right: [186, 270],
  lips: [32, 349]
};
const sheetSize = [340, 392];

function smooth(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}

function blinkAt(time, start, hold) {
  return smooth((time - start) / 0.12) * (1 - smooth((time - start - 0.12 - hold) / 0.16));
}

function drawLayer(context, sheet, key, region, opacity, dx = 0, dy = 0) {
  if (opacity <= 0) return;
  const [x, y, width, height] = region;
  const [sx, sy] = slots[key];
  context.globalAlpha = opacity;
  context.drawImage(sheet, sx, sy, width, height, x + dx, y + dy, width, height);
  context.globalAlpha = 1;
}

function createMovieRenderer(context, base, sheet) {
  const [armX, armY, armWidth, armHeight] = regions.arm;
  const [sheetX, sheetY] = slots.arm;
  const armWeights = Array.from({ length: armHeight }, (_, row) =>
    1 - smooth((armY + row - 222) / 201));
  const [kernelX, kernelY, kernelWidth, kernelHeight] = regions.kernel;
  const [kernelSheetX, kernelSheetY] = slots.kernel;
  const reachDistance = 25;
  const biteTime = 1.73;

  return elapsed => {
    const time = elapsed % loopSeconds;
    const reach = smooth((time - 0.43) / 1.18) * (1 - smooth((time - 1.94) / 1.02));
    const swallowed = smooth((time - biteTime) / 0.15);
    const nextKernel = smooth((time - 6.70) / 0.25);
    const chewTime = time - 2.43;
    const chew = 0.84 * smooth(chewTime / 0.16) * (1 - smooth((chewTime - 0.93) / 0.28))
      * (1 - Math.cos(chewTime * Math.PI * 4)) / 2;
    const blink = Math.max(blinkAt(time, 1.51, 0.33), blinkAt(time, 3.66, 0.08),
      blinkAt(time, 5.37, 0.26), blinkAt(time, 6.57, 0.19));
    const rightGaze = time >= 1.72 && time < 5.57;
    const closedLips = swallowed * (1 - nextKernel);

    context.clearRect(0, 0, 680, 680);
    context.drawImage(base, 0, 0);
    if (rightGaze) drawLayer(context, sheet, 'right', regions.eyes, 1);
    drawLayer(context, sheet, 'closed', regions.eyes, blink);
    drawLayer(context, sheet, 'lips', regions.lips, closedLips, 0, chew);

    const kernelVisibility = 1 - swallowed * (1 - nextKernel);
    if (kernelVisibility > 0) {
      const scale = 1 - 0.30 * (1 - kernelVisibility);
      const retreat = 3 * (1 - kernelVisibility);
      context.globalAlpha = kernelVisibility;
      context.drawImage(sheet, kernelSheetX, kernelSheetY, kernelWidth, kernelHeight,
        kernelX - reachDistance * reach - retreat + (1 - scale) * kernelWidth / 2,
        kernelY + (1 - scale) * kernelHeight / 2,
        kernelWidth * scale, kernelHeight * scale);
      context.globalAlpha = 1;
    }

    // Translate a single cutout, easing to a fixed seam at the lower cuff.
    // Every row contains the same bracelet, fingers and sleeve in every frame.
    if (!reach) {
      drawLayer(context, sheet, 'arm', regions.arm, 1);
      return;
    }
    for (let row = 0; row < armHeight; row++) {
      const dx = -reachDistance * reach * armWeights[row];
      context.drawImage(sheet, sheetX, sheetY + row, armWidth, 1,
        armX + dx, armY + row, armWidth, 1);
    }
  };
}

  function syncMotion() {
    cancelAnimationFrame(frame);
    lastTime = 0;
    if (motion.matches || document.hidden) {
      figure.classList.remove('playing');
      return;
    }
    render(elapsed);
    figure.classList.add('playing');
    frame = requestAnimationFrame(draw);
  }

  motion.addEventListener('change', syncMotion);
  document.addEventListener('visibilitychange', syncMotion);
  syncMotion();
}

if (typeof document !== 'undefined') start().catch(() => {});

  </script>
</body>
</html>
