  <script type="module">
const loopSeconds = 7.2;
const poseAtlas = { x: 271, y: 95, width: 286, height: 371, count: 4 };

function smooth(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}

function influence(x, y, [cx, cy, rx, ry, angle = 0, core = 0.43]) {
  const dx = x - cx;
  const dy = y - cy;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const radius = Math.hypot((cos * dx + sin * dy) / rx, (-sin * dx + cos * dy) / ry);
  return 1 - smooth((radius - core) / (1 - core));
}

function blinkAt(time, start, hold) {
  const elapsed = time - start;
  return smooth(elapsed / 0.16) * (1 - smooth((elapsed - 0.16 - hold) / 0.25));
}

function eyeCoordinates(x, y, eye) {
  const dx = x - eye.x;
  const dy = y - eye.y;
  return [eye.cos * dx + eye.sin * dy, -eye.sin * dx + eye.cos * dy];
}

function blinkOffset(y, amount, radius) {
  // Draw the upper lid down and squeeze the iris into the closing lash line.
  const edge = y < amount * 1.2 ? -radius : radius;
  const lid = amount * 1.2;
  const slit = 1 - amount * 0.94;
  const distance = y - lid;
  const narrow = radius * 0.37 * slit;
  if (Math.abs(distance) < narrow) return distance / slit - y;
  const rest = (distance - Math.sign(distance) * narrow)
    / (edge - lid - Math.sign(distance) * narrow);
  return Math.sign(distance) * radius * 0.37 + rest * edge * 0.63 - y;
}

function resample(source, target, i, x, y, width) {
  const left = Math.floor(x);
  const top = Math.floor(y);
  const fx = x - left;
  const fy = y - top;
  const p = (top * width + left) * 4;
  const next = width * 4;
  const w0 = (1 - fx) * (1 - fy) * source[p + 3];
  const w1 = fx * (1 - fy) * source[p + 7];
  const w2 = (1 - fx) * fy * source[p + next + 3];
  const w3 = fx * fy * source[p + next + 7];
  const alpha = w0 + w1 + w2 + w3;

  target[i + 3] = alpha;
  if (!target[i + 3]) {
    target[i] = target[i + 1] = target[i + 2] = 0;
    return;
  }
  for (let c = 0; c < 3; c++) {
    target[i + c] = (w0 * source[p + c] + w1 * source[p + 4 + c]
      + w2 * source[p + next + c] + w3 * source[p + next + 4 + c]) / alpha;
  }
}

function createMovieLoop(source, width, rig, atlas) {
  const { region, head, reach, eyes, mouth, biteHand, contactGrip, restingGrip } = rig;
  const [left, top, patchWidth, patchHeight] = region;
  const eyelids = eyes.map(([x, y, rx, ry, angle]) => (
    { x, y, rx, ry, sin: Math.sin(angle), cos: Math.cos(angle) }
  ));
  const [mouthX, mouthY, mouthWidth, mouthHeight, mouthAngle] = mouth;
  const lips = {
    x: mouthX, y: mouthY, rx: mouthWidth, ry: mouthHeight,
    sin: Math.sin(mouthAngle), cos: Math.cos(mouthAngle)
  };
  const [handX, handY, handWidth, handHeight] = biteHand;
  const fingertips = { x: handX, y: handY, rx: handWidth, ry: handHeight, sin: 0, cos: 1 };
  function paintPose(base, frame, features) {
    const pose = new Uint8ClampedArray(base);
    for (let y = 0; y < poseAtlas.height; y++) {
      for (let x = 0; x < poseAtlas.width; x++) {
        const px = x + poseAtlas.x;
        const py = y + poseAtlas.y;
        const mix = Math.max(...features.map(feature => {
          const [u, v] = eyeCoordinates(px, py, feature);
          const across = smooth((1 - Math.abs(u) / feature.rx) / 0.22);
          const vertical = smooth((1 - Math.abs(v - 1) / (feature.ry + 3)) / 0.38);
          return across * vertical;
        }));
        if (!mix) continue;
        const target = (py * width + px) * 4;
        const sample = ((frame * poseAtlas.height + y) * poseAtlas.width + x) * 4;
        if (!atlas[sample + 3]) continue;
        for (let c = 0; c < 3; c++) {
          pose[target + c] += (atlas[sample + c] - pose[target + c]) * mix;
        }
      }
    }
    return pose;
  }
  const closedEyes = paintPose(source, 0, [...eyelids, lips, fingertips]);
  const rightGaze = paintPose(source, 1, eyelids);
  const emptyContact = paintPose(closedEyes, 2, [lips, contactGrip]);
  const emptyRest = paintPose(source, 3, [lips, restingGrip]);
  const nextPixel = new Uint8ClampedArray(4);
  const pixels = [];

  for (let y = top; y < top + patchHeight; y++) {
    for (let x = left; x < left + patchWidth; x++) {
      const headWeight = influence(x, y, head);
      const eye = eyelids.find(lid => {
        const [u, v] = eyeCoordinates(x, y, lid);
        return Math.abs(u) < lid.rx + 8 && Math.abs(v) < lid.ry + 8;
      });
      const [lipX, lipY] = eyeCoordinates(x, y, lips);
      const nearMouth = Math.abs(lipX) < lips.rx + 8 && Math.abs(lipY) < lips.ry + 8;
      const nearHand = Math.abs(x - handX) < handWidth + 14 && Math.abs(y - handY) < handHeight + 10;
      const chewWeight = influence(x, y, [mouthX, mouthY + 11, 30, 28, mouthAngle, 0.40]);
      if (headWeight || nearHand || eye || nearMouth) {
        pixels.push({ x, y, headWeight, eye, chewWeight, nearBite: nearMouth || nearHand });
      }
    }
  }

  return (output, elapsed) => {
    const time = (elapsed + 0.55) % loopSeconds;
    const phase = time / loopSeconds * Math.PI * 2;
    const turn = -Math.cos(phase - 0.15);
    const headSlide = 2.2 * turn;
    const headAngle = 0.023 * turn;
    const headSin = Math.sin(headAngle);
    const headCosOffset = Math.cos(headAngle) - 1;
    const headBob = 0.8 * Math.sin(phase);
    const handLift = smooth((time - 0.58) / 0.80) * (1 - smooth((time - 1.72) / 0.83));
    const biteStart = 1.44;
    const biteEnd = 1.62;
    const reset = 6.53;
    const withdrawing = time >= biteEnd && time < reset;
    let fromPose = source;
    let toPose = closedEyes;
    let mix = smooth(handLift);
    let traveling = true;
    if (time >= reset) {
      fromPose = emptyRest;
      toPose = source;
      mix = smooth((time - reset) / 0.28);
      traveling = false;
    } else if (withdrawing) {
      fromPose = emptyRest;
      toPose = emptyContact;
    } else if (time >= biteStart) {
      fromPose = closedEyes;
      toPose = emptyContact;
      mix = smooth((time - biteStart) / (biteEnd - biteStart));
      traveling = false;
    }
    const chewTime = time - 2.08;
    const chew = 1.45 * smooth(chewTime / 0.12) * (1 - smooth((chewTime - 0.89) / 0.22))
      * (1 - Math.cos(chewTime * Math.PI * 4)) / 2;
    const blink = Math.max(blinkAt(time, 1.22, 0.30), blinkAt(time, 3.55, 0.045),
      blinkAt(time, 5.1, 0.34));
    // The gaze changes behind the fully closed eyelids.
    const openEyes = time >= 1.52 && time < 5.38 ? rightGaze : source;
    const closedMix = smooth((blink - 0.40) / 0.27);

    for (const { x, y, headWeight, eye, chewWeight, nearBite } of pixels) {
      const dx = x - head[0] - headSlide;
      const dy = y - head[1] - 58;
      const sx = x + (headCosOffset * dx + headSin * dy - headSlide) * headWeight;
      const sy = y + (-headSin * dx + headCosOffset * dy - headBob) * headWeight;
      const index = ((y - top) * patchWidth + x - left) * 4;

      if (eye) {
        if (closedMix >= 1) {
          resample(closedEyes, output, index, sx, sy, width);
          continue;
        }
        const [u, v] = eyeCoordinates(sx, sy, eye);
        const lateral = smooth((1 - Math.abs(u) / eye.rx) / 0.41);
        const close = blink * lateral * 0.82;
        const lid = blinkOffset(v, close, eye.ry) * (1 - smooth((Math.abs(v) / eye.ry - 0.80) / 0.20));
        resample(openEyes, output, index, sx - lid * eye.sin, sy + lid * eye.cos, width);
        if (closedMix > 0) {
          resample(closedEyes, nextPixel, 0, sx, sy, width);
          for (let c = 0; c < 3; c++) {
            output[index + c] += (nextPixel[c] - output[index + c]) * closedMix;
          }
        }
      } else {
        if (!nearBite) {
          resample(source, output, index, sx, sy, width);
          continue;
        }
        const faceY = sy - chew * chewWeight;
        if (mix === 0 || mix === 1) {
          resample(mix === 0 ? fromPose : toPose, output, index, sx, faceY, width);
          continue;
        }
        // Align the painted hand poses on the way in and out, and keep the
        // fingertips in place while the popcorn disappears at her lips.
        const wristWeight = smooth((sy - 183) / 16) * (1 - smooth((sy - 266) / 127));
        const restingEdge = 408 + Math.max(0, Math.min(42, (sy - 211) * 0.29));
        const handEdge = restingEdge + reach[0] * handLift * wristWeight;
        const handWeight = traveling ? wristWeight * smooth((sx - handEdge + 9) / 14)
          * (1 - smooth((sx - 513) / 43)) : 0;
        const handX = reach[0] * handWeight;
        const handY = reach[1] * handWeight;
        resample(fromPose, output, index, sx - handX * handLift, faceY - handY * handLift, width);
        resample(toPose, nextPixel, 0, sx + handX * (1 - handLift), faceY + handY * (1 - handLift), width);
        // Once her empty fingers clear her lips, retain the resting cheek beneath them.
        const cheekGuard = withdrawing ? (1 - smooth((handLift - 0.70) / 0.25))
          * (1 - smooth((sx - handEdge + 2) / 12)) * smooth((258 - sy) / 20) : 0;
        const pixelMix = mix * (1 - cheekGuard);
        for (let c = 0; c < 3; c++) {
          output[index + c] += (nextPixel[c] - output[index + c]) * pixelMix;
        }
      }
    }
  };
}

async function start() {
  const figure = document.querySelector('figure');
  const art = figure.querySelector('img');
  const canvas = figure.querySelector('canvas');

  let frame = 0;
  let elapsed = 0;
  let lastTime = 0;

  function draw(now) {
    if (!lastTime || now - lastTime >= 32) {
      elapsed += lastTime ? Math.min(0.05, (now - lastTime) / 1000) : 0;
      lastTime = now;
      animate(patch.data, elapsed);
      context.putImageData(patch, x, y);
    }
    frame = requestAnimationFrame(draw);
  }

  function syncMotion() {
    cancelAnimationFrame(frame);
    lastTime = 0;
    if (motion.matches || document.hidden) {
      figure.classList.remove('playing');
      return;
    }
    figure.classList.add('playing');
    frame = requestAnimationFrame(draw);
  }

  motion.addEventListener('change', syncMotion);
  document.addEventListener('visibilitychange', syncMotion);
  syncMotion();
