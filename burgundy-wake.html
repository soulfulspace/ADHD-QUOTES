  <script type="module">
const loopSeconds = 7.4;
const poseAtlas = { x: 267, y: 152, width: 151, height: 150 };

function smooth(value) {
  const t = Math.max(0, Math.min(1, value));
  return t * t * (3 - 2 * t);
}

function influence(x, y, [cx, cy, rx, ry, angle = 0, core = 0.43]) {
  const dx = x - cx;
  const dy = y - cy;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const radius = Math.hypot((cos * dx + sin * dy) / rx, (-sin * dx + cos * dy) / ry);
  return 1 - smooth((radius - core) / (1 - core));
}

function featureCoordinates(x, y, eye) {
  const dx = x - eye.x;
  const dy = y - eye.y;
  return [eye.cos * dx + eye.sin * dy, -eye.sin * dx + eye.cos * dy];
}

function blinkOffset(y, amount, radius) {
  // Draw the upper lid down and squeeze the iris into the closing lash line.
  const edge = y < amount * 1.2 ? -radius : radius;
  const lid = amount * 1.2;
  const slit = 1 - amount * 0.94;
  const distance = y - lid;
  const narrow = radius * 0.37 * slit;
  if (Math.abs(distance) < narrow) return distance / slit - y;
  const rest = (distance - Math.sign(distance) * narrow)
    / (edge - lid - Math.sign(distance) * narrow);
  return Math.sign(distance) * radius * 0.37 + rest * edge * 0.63 - y;
}

function resample(source, target, i, x, y, width) {
  const left = Math.floor(x);
  const top = Math.floor(y);
  const fx = x - left;
  const fy = y - top;
  const p = (top * width + left) * 4;
  const next = width * 4;
  const w0 = (1 - fx) * (1 - fy) * source[p + 3];
  const w1 = fx * (1 - fy) * source[p + 7];
  const w2 = (1 - fx) * fy * source[p + next + 3];
  const w3 = fx * fy * source[p + next + 7];
  const alpha = w0 + w1 + w2 + w3;

  target[i + 3] = alpha;
  if (!target[i + 3]) {
    target[i] = target[i + 1] = target[i + 2] = 0;
    return;
  }
  for (let c = 0; c < 3; c++) {
    target[i + c] = (w0 * source[p + c] + w1 * source[p + 4 + c]
      + w2 * source[p + next + c] + w3 * source[p + next + 4 + c]) / alpha;
  }
}

function shape([x, y, rx, ry, angle]) {
  return { x, y, rx, ry, sin: Math.sin(angle), cos: Math.cos(angle) };
}

function poseWeight(x, y, feature) {
  const [u, v] = featureCoordinates(x, y, feature);
  return smooth((1 - Math.abs(u) / feature.rx) / 0.23)
    * smooth((1 - Math.abs(v) / feature.ry) / 0.3);
}

function lipOffset(v, sourceHeight, currentHeight, limit) {
  if (v <= 0 || v >= limit) return 0;
  if (v < currentHeight) return v * (sourceHeight / currentHeight - 1);
  return (sourceHeight - currentHeight) * (limit - v) / (limit - currentHeight);
}

function createWakeLoop(source, width, rig, atlas) {
  const { region, head, hand, eyes, mouth, lips } = rig;
  const [left, top, patchWidth, patchHeight] = region;
  const eyelids = eyes.map(shape);
  const yawnMouth = shape(mouth);
  const features = [...eyelids, yawnMouth];
  const yawnFrame = new Uint8ClampedArray(source);
  const yawnPixel = new Uint8ClampedArray(4);

  for (let y = 0; y < poseAtlas.height; y++) {
    for (let x = 0; x < poseAtlas.width; x++) {
      const px = x + poseAtlas.x;
      const py = y + poseAtlas.y;
      const mix = Math.max(...features.map(feature => poseWeight(px, py, feature)));
      if (!mix) continue;
      const target = (py * width + px) * 4;
      const sample = (y * poseAtlas.width + x) * 4;
      for (let c = 0; c < 3; c++) {
        yawnFrame[target + c] += (atlas[sample + c] - yawnFrame[target + c]) * mix;
      }
    }
  }

  const pixels = [];
  for (let y = top; y < top + patchHeight; y++) {
    for (let x = left; x < left + patchWidth; x++) {
      const headWeight = influence(x, y, head);
      const handWeight = Math.max(...hand.map(part => influence(x, y, part)));
      const feature = features.find(candidate => {
        const [u, v] = featureCoordinates(x, y, candidate);
        return Math.abs(u) < candidate.rx + 10 && Math.abs(v) < candidate.ry + 10;
      });
      if (headWeight || handWeight || feature) pixels.push({ x, y, headWeight, handWeight, feature });
    }
  }

  return (output, elapsed) => {
    const time = elapsed % loopSeconds;
    const yawn = smooth((time - 1.27) / 1.1) * (1 - smooth((time - 3.1) / 1.1));
    const eyesClose = smooth((time - 1.05) / 0.55) * (1 - smooth((time - 3.62) / 0.67));
    const closedMix = smooth((eyesClose - 0.40) / 0.27);
    const handLift = smooth((time - 1.16) / 1.22) * (1 - smooth((time - 3.16) / 1.13));
    const breathing = Math.sin(time / loopSeconds * Math.PI * 2);
    const headAngle = (yawn * 1.1 - breathing * 0.25) * 0.024;
    const headSin = Math.sin(headAngle);
    const headCosOffset = Math.cos(headAngle) - 1;
    const [restLip, openLip, limit] = lips;
    const currentLip = restLip + (openLip - restLip) * yawn;

    for (const { x, y, headWeight, handWeight, feature } of pixels) {
      const dx = x - head[0];
      const dy = y - head[1] - 55;
      const sx = x + (headCosOffset * dx + headSin * dy) * headWeight
        - handLift * rig.handShift[0] * handWeight;
      const sy = y + (-headSin * dx + headCosOffset * dy + yawn * 3.5 + breathing * 1.1) * headWeight
        - handLift * rig.handShift[1] * handWeight;
      const index = ((y - top) * patchWidth + x - left) * 4;

      if (!feature) {
        resample(source, output, index, sx, sy, width);
        continue;
      }

      const [u, v] = featureCoordinates(sx, sy, feature);
      const lateral = smooth((1 - Math.abs(u) / feature.rx) / 0.4);
      let baseOffset = 0;
      let yawnOffset = 0;
      let mix = closedMix;
      if (feature === yawnMouth) {
        baseOffset = lipOffset(v, restLip, currentLip, limit) * lateral;
        yawnOffset = lipOffset(v, openLip, currentLip, limit) * lateral;
        mix = smooth(yawn);
      } else {
        const amount = eyesClose * lateral * 0.82;
        baseOffset = blinkOffset(v, amount, feature.ry)
          * smooth((1 - Math.abs(v) / feature.ry) / 0.2);
      }

      resample(source, output, index, sx - baseOffset * feature.sin, sy + baseOffset * feature.cos, width);
      if (mix) {
        resample(yawnFrame, yawnPixel, 0, sx - yawnOffset * feature.sin, sy + yawnOffset * feature.cos, width);
        for (let c = 0; c < 3; c++) {
          output[index + c] += (yawnPixel[c] - output[index + c]) * mix;
        }
      }
    }
  };
}
