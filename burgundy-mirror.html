  <style>
    html, body { margin: 0; background: transparent; }

      0%, 15% { transform: translateX(-235px); opacity: 0; }
      25% { opacity: 0.48; }
      48% { opacity: 0.39; }
      62%, 100% { transform: translateX(740px); opacity: 0; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.12; }
      38% { opacity: 0.74; }
      56% { opacity: 0.22; }
    }
    @keyframes twinkle {
      0%, 53%, 81%, 100% { opacity: 0; }
      64% { opacity: 0.69; }
      72% { opacity: 0.32; }
    }
    @media (prefers-color-scheme: dark) {
      figcaption { color: #e7c0ba; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glare, .grain, .glint { animation: none; }
    }
  </style>
